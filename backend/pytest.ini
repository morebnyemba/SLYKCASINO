[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_test.py
markers =
    wallet_rules: keep the real per-wallet minimum odds (see conftest.py)
    affiliate_auto: keep automatic affiliate approval and payout on (see conftest.py)
    affiliate_lock: keep the agent wallet's month-end lock on (see conftest.py)
    agent_code: keep the mandatory agent code at signup on (see conftest.py)
    strict_bets: placement rules as in production: a real market at its current price (see conftest.py)
    whatsapp_guard: keep WhatsApp pacing and the 18+ question on (see conftest.py)
    betstop: keep the bet stop after a goal on (see conftest.py)
    cashout_rules: keep the cash-out house protection on (see conftest.py)
