# =============================================================================
#  Mailcow behind the BetBlits edge nginx (used with docker-compose.mail.yml)
#
#  BetBlits owns :80/:443, so Mailcow's web side (admin UI, SOGo webmail,
#  ActiveSync, autodiscover) listens on plain HTTP :8080 inside Docker and this
#  file forwards mail.* / autodiscover.* / autoconfig.* to it over the private
#  `mail-proxy` network. Mail itself (SMTP 25/465/587, IMAP 143/993, POP3,
#  Sieve) never comes through here: Mailcow publishes those ports directly.
#
#  The certificate is Mailcow's own (its ACME client renews it; challenges are
#  forwarded below). 40-mailcow.sh only installs this file when that
#  certificate exists, so a missing Mailcow can never stop the casino booting.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ~^(mail|autodiscover|autoconfig)\.;

    # Mailcow's ACME client answers its own http-01 challenges.
    location ^~ /.well-known/acme-challenge/ {
        set $mailcow http://nginx-mailcow:8080;
        proxy_pass $mailcow;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;  # mail.* is DNS-only: no proxy in front, so never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(mail|autodiscover|autoconfig)\.;

    ssl_certificate     /etc/nginx/mailcow/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/mailcow/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mailcow enforces its own upload limit (NGINX_MAX_BODY_SIZE in mailcow.conf).
    client_max_body_size 0;

    # SOGo needs large proxy buffers (Mailcow's reverse-proxy guide).
    proxy_buffer_size       128k;
    proxy_buffers           64 512k;
    proxy_busy_buffers_size 512k;

    # Phones hold ActiveSync requests open for up to an hour (push mail).
    location ^~ /Microsoft-Server-ActiveSync {
        set $mailcow http://nginx-mailcow:8080;
        proxy_pass $mailcow;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;  # mail.* is DNS-only: no proxy in front, so never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75;
        proxy_send_timeout    3650;
        proxy_read_timeout    3650;
    }

    location / {
        set $mailcow http://nginx-mailcow:8080;
        proxy_pass $mailcow;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;  # mail.* is DNS-only: no proxy in front, so never trust a client-sent chain
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
